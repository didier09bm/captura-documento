<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Documento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="camera-card">
        <h2>Captura de Rostro</h2>
        <p class="instruction">Coloca tu rostro dentro del marco</p>

        <!-- Visor de la cámara con marco guía -->
        <div class="video-container">
            <video id="webcam" autoplay playsinline></video>
            <div class="document-guide"></div>
        </div>

        <!-- Botones de acción -->
        <div class="controls">
            <button id="btnTomarFoto">Tomar Foto</button>
            <button id="btnRepetir" class="hidden">Repetir Foto</button>
            <button id="btnConfirmar" class="hidden">Confirmar Foto</button>
        </div>

        <!-- Vista previa de la foto tomada -->
        <div class="preview-container hidden" id="previewContainer">
            <h3>Vista previa capturada:</h3>
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script src="app-bno.js"></script>
</body>
</html>
