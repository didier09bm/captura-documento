<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Documento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="camera-card">
        <h2>Captura de Documento</h2>
        <p class="instruction">Coloca tu documento dentro del marco</p>

        <!-- Visor de la cámara con marco guía (Se oculta al hacer la foto) -->
        <div class="video-container" id="videoContainer">
            <video id="webcam" autoplay playsinline></video>
            <div class="document-guide"></div>
        </div>

        <!-- Vista previa de la foto tomada (Oculta al inicio) -->
        <div class="preview-container hidden" id="previewContainer">
            <h3>Vista previa capturada:</h3>
            <canvas id="canvas"></canvas>
        </div>

        <!-- Botones de acción -->
        <div class="controls">
            <button id="btnTomarFoto">Tomar Foto</button>
            <button id="btnRepetir" class="hidden">Repetir Foto</button>
            <button id="btnConfirmar" class="hidden">Confirmar Foto</button>
        </div>
    </div>

    <script src="app-bno.js"></script>
</body>
</html>
